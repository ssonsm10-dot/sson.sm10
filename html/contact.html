<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Contact — SON SUNGMIN</title>

  <meta
    name="description"
    content="Contact SON SUNGMIN, Technical Product Manager."
  />

  <link
    rel="stylesheet"
    href="../css/contact.css"
  />
</head>


<body class="contact-page-body">

  <!-- =====================================================
       HEADER
       ===================================================== -->

  <header class="contact-page-header">

    <a
      href="../index.html"
      class="contact-logo"
    >
      © Code by SON SUNGMIN
    </a>


    <nav class="contact-nav">

  <a
  href="../index.html#work"
  class="js-project-transition"
>
  Projects
</a>

  <a
    href="../index.html#profile"
    class="js-about-transition"
    data-transition-label="About"
  >
    About
  </a>

  <a
    href="#"
    class="contact-nav-active"
    aria-current="page"
  >
    Contact
  </a>

</nav>

  </header>



  <!-- =====================================================
       CONTACT PAGE
       ===================================================== -->

  <main class="contact-page">


    <!-- HERO -->

    <section class="contact-page-hero">

      <div class="contact-page-title-wrap">

        <h1 class="contact-page-title">
          Let's start a<br />
          project together
        </h1>

      </div>

    </section>



    <!-- =====================================================
         FORM + DETAILS
         ===================================================== -->

    <section class="contact-page-content">


      <!-- ===================================================
           LEFT : FORM
           =================================================== -->

      <form
        class="contact-form"
        action="#"
        method="post"
      >


        <!-- 01 -->

        <div class="contact-field">

          <span class="contact-field-number">
            01
          </span>

          <div class="contact-field-main">

            <label for="contact-name">
              What's your name?
            </label>

            <input
              id="contact-name"
              name="name"
              type="text"
              placeholder="John Doe *"
              autocomplete="name"
              required
            />

          </div>

        </div>



        <!-- 02 -->

        <div class="contact-field">

          <span class="contact-field-number">
            02
          </span>

          <div class="contact-field-main">

            <label for="contact-email">
              What's your email?
            </label>

            <input
              id="contact-email"
              name="email"
              type="email"
              placeholder="john@doe.com *"
              autocomplete="email"
              required
            />

          </div>

        </div>



        <!-- 03 -->

        <div class="contact-field">

          <span class="contact-field-number">
            03
          </span>

          <div class="contact-field-main">

            <label for="contact-company">
              What's the name of your organization?
            </label>

            <input
              id="contact-company"
              name="organization"
              type="text"
              placeholder="John & Doe®"
              autocomplete="organization"
            />

          </div>

        </div>



        <!-- 04 -->

        <div class="contact-field">

          <span class="contact-field-number">
            04
          </span>

          <div class="contact-field-main">

            <label for="contact-service">
              What services are you looking for?
            </label>

            <input
              id="contact-service"
              name="service"
              type="text"
              placeholder="Product Strategy, UX/UI, Technical Collaboration..."
            />

          </div>

        </div>



        <!-- 05 -->

        <div class="contact-field">

          <span class="contact-field-number">
            05
          </span>

          <div class="contact-field-main">

            <label for="contact-message">
              Your message
            </label>

            <textarea
              id="contact-message"
              name="message"
              rows="3"
              placeholder="Hello Sungmin, can you help me with ... *"
              required
            ></textarea>

          </div>

        </div>



        <!-- SEND -->

        <div class="contact-send-row">

          <div
            class="contact-send-line"
            aria-hidden="true"
          ></div>

          <button
            type="submit"
            class="contact-send-button"
          >
            Send it!
          </button>

        </div>

      </form>



      <!-- ===================================================
           RIGHT : DETAILS
           =================================================== -->

      <aside class="contact-side">


        <!-- PROFILE IMAGE -->

        <div class="contact-side-image">

          <img
            src="../Image/intro_images/index_main1.png"
            alt="SON SUNGMIN"
          />

        </div>



        <!-- CONTACT -->

        <div class="contact-side-block">

          <span class="contact-side-label">
            CONTACT DETAILS
          </span>

          <a href="mailto:sson.sm10@gmail.com">
            sson.sm10@gmail.com
          </a>

          <p>
            Seoul, South Korea
          </p>

        </div>



        <!-- PROFILE -->

        <div class="contact-side-block">

          <span class="contact-side-label">
            PROFILE
          </span>

          <p>
            SON SUNGMIN
          </p>

          <p>
            Technical Product Manager
          </p>

        </div>



        <!-- SOCIALS -->

        <div class="contact-side-block">

          <span class="contact-side-label">
            SOCIALS
          </span>

          <a
            href="https://github.com/ssonsm10-dot"
            target="_blank"
            rel="noopener noreferrer"
          >
            GitHub
          </a>

        </div>

      </aside>

    </section>

  </main>



  <!-- =====================================================
       FOOTER
       ===================================================== -->

  <footer class="contact-page-footer">

    <div>

      <span class="contact-footer-label">
        BASED IN
      </span>

      <span>
        Seoul, South Korea
      </span>

    </div>


    <div>

      <span class="contact-footer-label">
        SOCIALS
      </span>

      <nav>

        <a
          href="https://github.com/ssonsm10-dot"
          target="_blank"
          rel="noopener noreferrer"
        >
          GitHub
        </a>

      </nav>

    </div>

  </footer>



  <!-- =====================================================
       SCRIPT
       ===================================================== -->

  <script src="../JS/main.js"></script>

</body>

</html>
